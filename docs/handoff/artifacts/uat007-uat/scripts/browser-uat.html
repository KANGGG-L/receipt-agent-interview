<script src="http://127.0.0.1:15200/static/js/inventory_board.js"></script>
<script>
(async function() {
  const out = document.getElementById('out');
  try {
    if (typeof loadInventoryLedger !== 'function') throw new Error('loadInventoryLedger missing');
    if (typeof invLedgerQtyText !== 'function') throw new Error('invLedgerQtyText missing');
    loadInventoryLedger();
    await new Promise(r => setTimeout(r, 150));
    const rows = [...document.querySelectorAll('#inventoryLedgerBody tr')];
    const painted = rows.map(tr => {
      const tds = [...tr.querySelectorAll('td')];
      return {
        kindLabel: (tds[1] && tds[1].textContent || '').trim(),
        name: (tds[2] && tds[2].textContent || '').trim(),
        qtyText: (tds[3] && tds[3].textContent || '').trim(),
      };
    });
    // helper on sample rows
    const samples = (window.__UAT007_API__.data || []).map(r => ({
      id: r.id, kind: r.kind, qty: r.qty, qty_signed: r.qty_signed,
      paintedText: invLedgerQtyText(r)
    }));
    const consumePainted = painted.filter(p => p.kindLabel.includes('消耗') || p.kindLabel.toLowerCase().includes('consume'));
    // Chinese label map uses 消耗 for consume
    const consumeTexts = samples.filter(s => s.kind === 'consume').map(s => s.paintedText);
    const inTexts = samples.filter(s => s.kind === 'in' && Number(s.qty) === 1).map(s => s.paintedText);
    const revTexts = samples.filter(s => s.kind === 'reversal').map(s => s.paintedText);
    const adjTexts = samples.filter(s => s.kind === 'adjust').map(s => s.paintedText);
    const consumeCellTexts = painted.filter(p => {
      // match by looking at samples order via name+qty
      return consumeTexts.includes(p.qtyText) && p.qtyText.startsWith('-');
    });
    const result = {
      painted,
      samples,
      consumeTexts,
      inTexts,
      revTexts,
      adjTexts,
      consumeShowsNegative: consumeTexts.length > 0 && consumeTexts.every(t => t === '-1'),
      consumeNotBlindPlus: consumeTexts.every(t => t !== '+1'),
      inboundShowsPlus: inTexts.length > 0 && inTexts.every(t => t === '+1'),
      reversalShowsNegative: revTexts.every(t => t === '-1'),
      adjustShowsPlus: adjTexts.every(t => t === '+1'),
      paintedConsumeNeg: painted.some(p => p.qtyText === '-1'),
      paintedInboundPos: painted.some(p => p.qtyText === '+1'),
      noBlindPlusOnConsume: !painted.some(p => p.qtyText === '+1' && (p.kindLabel.includes('消耗'))),
    };
    result.UAT007_PASS = !!(
      result.consumeShowsNegative && result.consumeNotBlindPlus &&
      result.inboundShowsPlus && result.reversalShowsNegative &&
      result.adjustShowsPlus && result.paintedConsumeNeg && result.paintedInboundPos
    );
    out.textContent = 'TITLE_TAG ' + (result.UAT007_PASS ? 'UAT007_PASS' : 'UAT007_FAIL') + '\n' + JSON.stringify(result, null, 2);
    document.title = result.UAT007_PASS ? 'UAT007_PASS' : 'UAT007_FAIL';
  } catch (e) {
    out.textContent = 'TITLE_TAG UAT007_FAIL\n' + String(e && e.stack || e);
    document.title = 'UAT007_FAIL';
  }
})();
</script>
