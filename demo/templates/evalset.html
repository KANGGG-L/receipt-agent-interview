<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GT 人工抽检台</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, "PingFang HK", "Microsoft JhengHei", sans-serif;
           background: #f1f5f9; color: #1e293b; font-size: 14px; }
    .topbar { background: #fff; border-bottom: 1px solid #e2e8f0; padding: 12px 20px;
              display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
    .topbar h1 { font-size: 1.05rem; font-weight: 700; }
    .badge-admin { color: #b91c1c; font-size: 0.68rem; border: 1px solid #b91c1c;
                   border-radius: 4px; padding: 1px 5px; }
    .controls { display: flex; align-items: center; gap: 8px; margin-left: auto; flex-wrap: wrap; }
    select, input[type="text"], input[type="number"], input[type="date"] {
        border: 1px solid #cbd5e1; border-radius: 6px; padding: 8px 10px;
        font-size: 0.88rem; background: #fff; min-height: 38px; }
    button { border: none; border-radius: 6px; padding: 9px 16px; font-size: 0.88rem;
             cursor: pointer; min-height: 38px; font-weight: 600; }
    .btn-primary { background: #1d4ed8; color: #fff; }
    .btn-primary:hover { background: #1e40af; }
    .btn-secondary { background: #fff; color: #334155; border: 1px solid #cbd5e1; }
    .btn-secondary:hover { background: #f8fafc; }
    .btn-success { background: #15803d; color: #fff; }
    .btn-success:hover { background: #166534; }
    .btn-danger { background: #fff; color: #b91c1c; border: 1px solid #fca5a5; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .progress-wrap { padding: 10px 20px 0 20px; }
    .progress-line { display: flex; align-items: center; gap: 10px; margin-bottom: 6px;
                     font-size: 0.85rem; color: #475569; }
    .progress-bar { height: 8px; background: #e2e8f0; border-radius: 4px; overflow: hidden; flex: 1; }
    .progress-fill { height: 100%; background: #15803d; border-radius: 4px; transition: width 0.3s; }
    .main { display: grid; grid-template-columns: minmax(320px, 46%) 1fr; gap: 14px;
            padding: 14px 20px 20px 20px; }
    .pane { background: #fff; border: 1px solid #e2e8f0; border-radius: 10px; padding: 12px; }
    .pane-title { font-weight: 700; font-size: 0.9rem; margin-bottom: 8px; color: #334155;
                  display: flex; justify-content: space-between; align-items: center; }
    .img-box { background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 8px;
               display: flex; align-items: center; justify-content: center;
               overflow: auto; height: calc(100vh - 190px); padding: 8px; }
    .img-box img { max-width: 100%; max-height: 100%; object-fit: contain; }
    .img-missing { color: #b91c1c; font-size: 0.9rem; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
    .field label { display: block; font-size: 0.78rem; color: #64748b; margin-bottom: 3px; }
    .field input, .field select { width: 100%; }
    .field-wide { grid-column: span 2; }
    table.items { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
    table.items th { background: #f1f5f9; text-align: left; padding: 6px 6px;
                     border-bottom: 1px solid #e2e8f0; font-weight: 600; }
    table.items td { padding: 4px 4px; border-bottom: 1px solid #f1f5f9; }
    table.items input { min-height: 34px; padding: 5px 8px; font-size: 0.82rem; width: 100%; }
    .row-del { background: #fff; color: #b91c1c; border: 1px solid #fca5a5;
               min-height: 38px; min-width: 38px; padding: 6px 12px; font-size: 0.8rem; }
    .actions { display: flex; gap: 10px; margin-top: 12px; flex-wrap: wrap; align-items: center; }
    .kbd-hint { color: #94a3b8; font-size: 0.78rem; }
    kbd { background: #e2e8f0; border-radius: 4px; padding: 1px 6px;
          font-family: monospace; font-size: 0.78rem; }
    .status-ok { color: #15803d; font-weight: 700; }
    .status-draft { color: #b45309; font-weight: 700; }
    .status-missing { color: #64748b; font-weight: 700; }
    .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
             background: #1e293b; color: #fff; border-radius: 8px; padding: 10px 18px;
             font-size: 0.88rem; display: none; z-index: 99; max-width: 80vw; }
    .toast.err { background: #b91c1c; }
    .loading-note { color: #64748b; padding: 24px; text-align: center; }
    .reflow-wrap { padding: 0 20px 24px 20px; }
    .reflow-pane { background: #fff; border: 1px solid #e2e8f0; border-radius: 10px; padding: 12px; }
    table.reflow { width: 100%; border-collapse: collapse; font-size: 0.84rem; }
    table.reflow th { background: #f1f5f9; text-align: left; padding: 6px 8px;
                      border-bottom: 1px solid #e2e8f0; font-weight: 600; }
    table.reflow td { padding: 6px 8px; border-bottom: 1px solid #f1f5f9; vertical-align: top; }
    .reflow-actions { display: flex; gap: 6px; flex-wrap: wrap; }
    @media (max-width: 900px) { .main { grid-template-columns: 1fr; }
        .img-box { height: 46vh; } }
</style>
</head>
<body>
    <div class="topbar">
        <h1>GT 人工抽检台 <span class="badge-admin">admin</span></h1>
        <span id="roleNote" style="font-size:0.8rem; color:#64748b;"></span>
        <div class="controls">
            <select id="splitSelect" onchange="onFilterChange()">
                <option value="test" selected>test（出分必确认）</option>
                <option value="val">val</option>
                <option value="train">train</option>
            </select>
            <select id="statusSelect" onchange="onFilterChange()">
                <option value="draft" selected>待抽检（draft）</option>
                <option value="confirmed">已确认</option>
                <option value="">全部状态</option>
            </select>
            <button class="btn-secondary" onclick="reloadAll()">刷新</button>
            <button class="btn-secondary" id="batchBtn" onclick="batchConfirmUntouched()">批量原样确认本批（未经逐张核对）</button>
        </div>
    </div>

    <div class="progress-wrap">
        <div class="progress-line">
            <span id="progressText">加载中…</span>
            <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
            <span id="posText" class="kbd-hint"></span>
        </div>
    </div>

    <div class="main">
        <div class="pane">
            <div class="pane-title">
                <span>单据预览（缩略图）</span>
                <span id="imgMeta" class="kbd-hint"></span>
            </div>
            <div class="img-box" id="imgBox">
                <div class="loading-note">加载中…</div>
            </div>
        </div>
        <div class="pane">
            <div class="pane-title">
                <span>GT 候选校正</span>
                <span id="gtStatusBadge" class="status-draft"></span>
            </div>
            <div id="formArea">
                <div class="form-grid">
                    <div class="field field-wide"><label>供应商名称（图面原文）</label>
                        <input type="text" id="fSupplier"></div>
                    <div class="field"><label>开单日期</label>
                        <input type="date" id="fDate"></div>
                    <div class="field"><label>总额（图面原文，禁止重算）</label>
                        <input type="number" step="0.01" id="fTotal"></div>
                    <div class="field field-wide"><label>单据形态</label>
                        <select id="fDocForm">
                            <option value="printed_delivery_note">印刷送货单 printed_delivery_note</option>
                            <option value="ncr_handwritten">手写单 ncr_handwritten</option>
                            <option value="thermal">热敏小票 thermal</option>
                            <option value="weigh_slip">磅单 weigh_slip</option>
                            <option value="correction_note">更正单 correction_note</option>
                            <option value="monthly_statement">月结单 monthly_statement</option>
                        </select></div>
                </div>
                <div class="pane-title" style="margin-top:4px;">
                    <span>明细行</span>
                    <button class="btn-secondary" style="min-height:38px; padding:6px 14px; font-size:0.8rem;"
                            onclick="addItemRow()">加一行</button>
                </div>
                <div style="max-height: 32vh; overflow:auto;">
                    <table class="items">
                        <thead><tr><th style="width:32%;">品名</th><th>数量</th><th>单位</th>
                            <th>单价</th><th>金额</th><th style="width:36px;"></th></tr></thead>
                        <tbody id="itemsBody"></tbody>
                    </table>
                </div>
                <div class="actions">
                    <button class="btn-success" id="confirmBtn" onclick="confirmCurrent(false)">
                        确认本张（A）并跳下一张</button>
                    <button class="btn-primary" id="workbenchBtn" onclick="openWorkbench()"
                            title="跳转到与店员复核界面同源的工作台（同一套 Side-by-Side DOM/字段/流程）">
                        在工作台核对（店员同款复核界面）</button>
                    <button class="btn-secondary" onclick="nextSample()">下一张（J）</button>
                    <button class="btn-secondary" onclick="prevSample()">上一张（K）</button>
                    <span class="kbd-hint">快捷键：<kbd>J</kbd> 下一张　<kbd>K</kbd> 上一张　<kbd>A</kbd> 确认并下一张</span>
                </div>
            </div>
            <div id="emptyNote" class="loading-note hide"></div>
        </div>
    </div>

    <div class="reflow-wrap">
        <div class="reflow-pane">
            <div class="pane-title">
                <span>回流候选（线上识别失败/低置信样本，确认后进入评测集）</span>
                <span class="kbd-hint">晋升后 GT 为 AI 候选（draft），仍需在上方逐张核对确认</span>
            </div>
            <div style="overflow:auto; max-height: 40vh;">
                <table class="reflow">
                    <thead><tr><th>候选</th><th>单据</th><th>触发原因</th><th>置信度</th>
                        <th>说明</th><th style="width:230px;">操作</th></tr></thead>
                    <tbody id="reflowBody">
                        <tr><td colspan="6" class="loading-note">加载中…</td></tr>
                    </tbody>
                </table>
            </div>
            <div id="reflowEmpty" class="loading-note hide"></div>
        </div>
    </div>

    <div class="toast" id="toast"></div>
    <script src="/static/js/evalset.js"></script>
</body>
</html>
