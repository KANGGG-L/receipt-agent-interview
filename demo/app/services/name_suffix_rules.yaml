# 名称后缀剥离规则 —— 匹配与候选生成共用（_normalize_sku_name 单点消费）。
# 维护纪律：只剥【显式后缀】（锚定结尾 + 必须含显式单位/容器词）；新增模式须附正例/阴性对照。
version: "2026-09-27"
max_repeat: 3        # 重复应用至稳定（复合后缀），上限防病态回溯
suffix_patterns:     # 按序应用；以下为校准后的五条（§4.3 实测依据）
  - "(?:[xX×]\\s*)?\\d+(?:\\.\\d+)?\\s*(?:毫升|公升|升|ml|mL|ML|L|l)\\s*(?:裝|装|瓶|樽|罐|盒|包|支|膠|胶)?\\s*$"
  - "(?:[xX×]\\s*)?\\d+(?:\\.\\d+)?\\s*(?:kg|KG|Kg|千克|公斤|克|g|G|磅)\\s*$"
  - "\\d+(?:\\.\\d+)?\\s*(?:毫升|公升|升|ml|mL|ML|L|l)\\s*[*xX×]\\s*\\d+\\s*(?:樽|瓶|箱|包|罐|盒|支|包裝|装|裝)?\\s*$"
  - "\\d+\\s*[*xX×]\\s*\\d+\\s*(?:個|个|罐|盒|包|樽|瓶|支|包裝|装|裝|入)\\s*$"
  - "\\d+\\s*(?:個|个|罐|盒|包|樽|瓶|支|包裝|装|裝|入)\\s*$"
# 禁入清单（测试钉死，宁窄勿宽）：
# - 斤/司馬斤/司马斤 重量族：tests/test_fix_b_p0_sku_explosion.py 的 10司馬斤 守卫（S11）
# - 裸数字 / 裸 *N / 无容器词的 NxM：防 TS-4X8、H12+8-2K 型货号误伤（阴性对照 S13 校准）
# - 只剥结尾；品名中段/开头的规格（括号中段）不动
